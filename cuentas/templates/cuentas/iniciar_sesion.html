<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | TechMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 450px;">
            <div class="card-body p-4">
                <h1 class="h3 text-center mb-4">Iniciar sesión</h1>

                <form method="post">
                    {% csrf_token %}

                    {% for campo in formulario %}
                        <div class="mb-3">
                            <label class="form-label" for="{{ campo.id_for_label }}">
                                {{ campo.label }}
                            </label>

                            {{ campo }}

                            {% for error in campo.errors %}
                                <div class="text-danger small">
                                    {{ error }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    {% if formulario.non_field_errors %}
                        <div class="alert alert-danger">
                            Usuario o contraseña incorrectos.
                        </div>
                    {% endif %}

                    <button class="btn btn-primary w-100" type="submit">
                        Entrar
                    </button>
                </form>

                <p class="text-center mt-3 mb-0">
                    ¿No tienes cuenta?
                    <a href="{% url 'registro' %}">Regístrate</a>
                </p>

                <p class="text-center mt-3 mb-0">
                    <a href="{% url 'catalogo' %}">Volver a la tienda</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll("input").forEach(function (campo) {
            campo.classList.add("form-control");
        });
    </script>
</body>
</html>
